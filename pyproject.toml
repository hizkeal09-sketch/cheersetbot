[project]
name = "cheers-dating"
version = "1.0.0"
description = "Cheers Dating - a modern Telegram dating bot"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.17,<4.0",
    "SQLAlchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "aiosqlite>=0.20,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "fastapi>=0.115,<1.0",
    "tzdata>=2024.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["migrations/versions"]

[tool.vercel]
entrypoint = "vercel_app:app"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
